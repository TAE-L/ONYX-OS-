[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
# Boots, runs the in-kernel self-test suite, reports over serial and exits QEMU.
selftest = []
# Force the calibrated one-shot LAPIC timer even when TSC-deadline exists (tests the fallback).
timer-oneshot = []

[dependencies]
spin = "0.10"
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
